name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VITE_FONT_PRECONNECT_URL: ${{ vars.VITE_FONT_PRECONNECT_URL }}
      VITE_FONT_ASSETS_PRECONNECT_URL: ${{ vars.VITE_FONT_ASSETS_PRECONNECT_URL }}
      VITE_FONT_STYLESHEET_URL: ${{ vars.VITE_FONT_STYLESHEET_URL }}
      VITE_EMAIL_LINK: ${{ vars.VITE_EMAIL_LINK }}
      VITE_EMAIL_ADDRESS: ${{ vars.VITE_EMAIL_ADDRESS }}
      VITE_PHONE_LINK: ${{ vars.VITE_PHONE_LINK }}
      VITE_PHONE_DISPLAY: ${{ vars.VITE_PHONE_DISPLAY }}
      VITE_LINKEDIN_ABOUT_URL: ${{ vars.VITE_LINKEDIN_ABOUT_URL }}
      VITE_GITHUB_ABOUT_URL: ${{ vars.VITE_GITHUB_ABOUT_URL }}
      VITE_LINKEDIN_CONTACT_URL: ${{ vars.VITE_LINKEDIN_CONTACT_URL }}
      VITE_GITHUB_CONTACT_URL: ${{ vars.VITE_GITHUB_CONTACT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GAURAV_JAIN_PORTFOLIO }}
          projectId: gaurav-jain-portfolio
